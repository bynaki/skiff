<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <!--
    The page renders remote file contents next to a privileged bridge, so it runs only the bundle.
    Styles allow 'unsafe-inline' for the <style> below; CodeMirror's own go through constructed
    stylesheets. img-src stops a rendered document from calling out to a tracking pixel, and
    MainActivity refuses such requests again at the network layer.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Skiff Code</title>
  <style>
    html, body { margin: 0; height: 100%; }
    #editor { height: 100%; }
    #hud {
      position: fixed; top: 40px; right: 12px; z-index: 10; max-width: 60%;
      padding: 6px 10px; border-radius: 6px; background: rgba(0, 0, 0, 0.7); color: #fff;
      font: 13px/1.4 monospace; white-space: pre; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="editor"></div>
  <div id="hud">loading…</div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
