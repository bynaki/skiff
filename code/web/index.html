<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <!--
    The page renders remote file contents next to a privileged bridge, so it runs only the bundle.
    Styles allow 'unsafe-inline' for the <style> below; CodeMirror's own go through constructed
    stylesheets. img-src stops a rendered document from calling out to a tracking pixel, and
    MainActivity refuses such requests again at the network layer.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Skiff Code</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body { background: #fff; color: #1f2328; font-family: sans-serif; }
    #viewer { height: 100%; }
    .notice { padding: calc(var(--topbar-space) + 16px) 24px 32px; }
    .notice h1 { margin: 0 0 8px; font-size: 18px; }
    .notice p { margin: 0; color: #59636e; overflow-wrap: anywhere; }
    /* Positioned so a block's offsetTop is measured from it, for scrolling to a link's line. */
    .markdown-scroller { position: relative; height: 100%; overflow: auto; touch-action: pan-x pan-y; }
    .markdown {
      max-width: 60em; margin: 0 auto; padding: var(--topbar-space) 24px 48px;
      font-size: var(--code-font-size); line-height: 1.6; overflow-wrap: break-word;
    }
    .markdown h1, .markdown h2 { border-bottom: 1px solid #d1d9e0; padding-bottom: 0.3em; }
    .markdown a { color: #0969da; }
    .markdown code { font-family: monospace; font-size: 0.9em; background: #eff1f3; padding: 0.1em 0.3em; border-radius: 4px; }
    .markdown pre { background: #f6f8fa; padding: 12px 16px; border-radius: 6px; overflow: auto; }
    .markdown pre code { background: none; padding: 0; }
    .markdown blockquote { margin-left: 0; padding-left: 1em; border-left: 4px solid #d1d9e0; color: #59636e; }
    .markdown table { border-collapse: collapse; display: block; overflow: auto; }
    .markdown th, .markdown td { border: 1px solid #d1d9e0; padding: 4px 12px; }
    .markdown img { max-width: 100%; }
    /* An opaque bar across the top. The layers keep --topbar-space clear so their first line is
       never under it, and it slides away when a layer is scrolled down. */
    #topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10; box-sizing: border-box;
      height: var(--topbar-space); padding: 8px; display: flex; justify-content: space-between; align-items: center;
      background: #fff; border-bottom: 1px solid #d1d9e0; transition: transform 0.2s ease;
    }
    #topbar.hidden { transform: translateY(-100%); }
    #topbar .group { display: flex; }
    #topbar button { width: 40px; height: 40px; padding: 8px; color: #1f2328; background: none; border: 0; }
    #topbar button:disabled { color: #afb8c1; }
    #topbar svg { display: block; width: 22px; height: 22px; }
    /* What happened to the file while it was open, along the bottom: the menu above slides away
       with the scroll and would carry the message off with it. */
    #banner {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; box-sizing: border-box;
      padding: 12px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between;
      background: #1f2328; color: #fff;
    }
    /* display: flex would otherwise win over the hidden attribute. */
    #banner[hidden] { display: none; }
    #banner p { margin: 0; font-size: 14px; }
    #banner .actions { display: flex; gap: 8px; flex: none; }
    #banner button {
      padding: 8px 12px; color: #fff; background: none;
      border: 1px solid #59636e; border-radius: 6px; font-size: 14px;
    }
    /* The command button in the bottom-right corner and what opens out of it. A is the button
       alone at half strength; open, the row stretches and the results stack above it. It sits
       above the banner when there is one (--banner-space), so the answer there stays reachable. */
    #palette {
      position: fixed; left: 16px; right: 16px; bottom: calc(16px + var(--banner-space, 0px)); z-index: 16;
      display: flex; flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: none;
    }
    #palette > * { pointer-events: auto; }
    #palette .row { display: flex; align-items: center; gap: 8px; }
    #palette.open .row { align-self: stretch; }
    #palette:not(.open) input { display: none; }
    #palette input {
      flex: 1; min-width: 0; box-sizing: border-box; height: 48px; padding: 0 16px;
      font: inherit; font-size: 16px; color: #1f2328; background: #fff;
      border: 1px solid #d1d9e0; border-radius: 24px;
    }
    #palette .mode {
      flex: none; width: 56px; height: 56px; padding: 0; font-size: 22px;
      color: #fff; background: #1f2328; border: 0; border-radius: 28px; opacity: 0.5;
    }
    #palette.open .mode { opacity: 1; }
    #palette .results {
      align-self: stretch; margin: 0; padding: 0; max-height: 40vh; overflow: auto; list-style: none;
      background: #fff; border: 1px solid #d1d9e0; border-radius: 8px;
    }
    #palette .results li { padding: 12px 16px; font-size: 15px; border-bottom: 1px solid #eff1f3; }
    #palette .results li:last-child { border-bottom: 0; }
    #palette .results li.selected { background: #eff1f3; }
    #palette .results li.none { color: #59636e; }
    /* Transparent on purpose: what is being searched for is usually in the document behind it. */
    #palette-scrim { position: fixed; inset: 0; z-index: 15; }
    #palette-scrim:not(.open) { display: none; }
    /* The drawer behind ①: the files that are open, and in M5 the projects and their trees. It
       covers the menu while it is out, so the way back is the scrim over the layer. */
    #scrim {
      position: fixed; inset: 0; z-index: 20; background: rgba(31, 35, 40, 0.4);
      opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
    }
    #scrim.open { opacity: 1; pointer-events: auto; }
    #sidebar {
      position: fixed; top: 0; bottom: 0; left: 0; z-index: 21; box-sizing: border-box;
      width: min(320px, 80vw); display: flex; flex-direction: column; overflow: hidden;
      background: #fff; border-right: 1px solid #d1d9e0;
      transform: translateX(-100%); transition: transform 0.2s ease;
    }
    #sidebar.open { transform: none; }
    /* The same box the menu's ① sits in, so the drawer's own lands exactly on top of it. It stays
       put while the list scrolls under it. */
    #sidebar header {
      flex: none; box-sizing: border-box; height: var(--topbar-space); padding: 8px;
      display: flex; align-items: center; border-bottom: 1px solid #d1d9e0;
    }
    #sidebar header button { width: 40px; height: 40px; padding: 8px; color: #1f2328; background: none; border: 0; }
    #sidebar header svg { display: block; width: 22px; height: 22px; }
    #sidebar ul { flex: 1; margin: 0; padding: 0; list-style: none; overflow: auto; }
    #sidebar li { display: flex; align-items: center; border-bottom: 1px solid #eff1f3; }
    #sidebar li.current { background: #eff1f3; }
    #sidebar li.empty { padding: 16px; color: #59636e; font-size: 14px; border: 0; }
    #sidebar .entry {
      flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;
      padding: 12px 4px 12px 16px; color: inherit; font: inherit; text-align: left;
      background: none; border: 0;
    }
    #sidebar .name { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* Right to left, so what is clipped on a narrow screen is the start of the path: the directory
       a file is in is what tells two files of the same name apart. The text itself carries a
       left-to-right mark, which keeps the path reading forwards inside the box. */
    #sidebar .where {
      font-size: 12px; color: #59636e; direction: rtl; text-align: left;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #sidebar .close {
      flex: none; width: 40px; height: 40px; margin-right: 8px; padding: 0;
      font-size: 20px; color: #59636e; background: none; border: 0;
    }
    /* A file that has been typed in cannot be saved yet, so closing it asks in its own row. */
    #sidebar li.confirming { display: block; padding: 12px 16px; }
    #sidebar li.confirming p { margin: 0 0 8px; font-size: 14px; }
    #sidebar .answers { display: flex; gap: 8px; justify-content: flex-end; }
    #sidebar .answers button {
      padding: 6px 12px; font-size: 14px; color: #1f2328; background: none;
      border: 1px solid #d1d9e0; border-radius: 6px;
    }
    #sidebar .answers .confirm { color: #fff; background: #1f2328; border-color: #1f2328; }
  </style>
</head>
<body>
  <div id="viewer"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
