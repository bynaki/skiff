# Rosé Pine Dawn, converted to a Skiff Code theme.
# Source: https://github.com/rose-pine/vscode at d8f5ebe8e096fa833e997c07eb7685ee1677a4ba,
#   themes/rose-pine-dawn-color-theme.json
# License: MIT, Copyright (c) 2021 Rosé Pine. The full text is in NOTICE.md beside this file.
# Written by code/web/scripts/themes/generate.ts from scripts/themes/data/rose-pine.json. The comment
# after each color names what in the source it came from.
base = "light"

# The menu, the sidebar, the palette, the open files menu and the banner.
[ui]
background = "#faf4ed" # sideBar.background
foreground = "#797593" # sideBar.foreground
muted = "#797593" # descriptionForeground
border = "#f2e9e1" # editorWidget.border
faint = "#61616180" # disabledForeground: VS Code's default for a light theme
subtle = "#6e6a860d" # list.hoverBackground
accent = "#d7827e" # button.background
scrim = "#faf4ed99" # none in the source: editor.background at alpha 99
strong_background = "#d7827e" # button.background
strong_foreground = "#faf4ed" # button.foreground

# The document: the code views and rendered markdown.
[editor]
background = "#faf4ed" # editor.background
foreground = "#575279" # editor.foreground
gutter_background = "#faf4ed" # editorGutter.background
gutter_foreground = "#797593" # editorLineNumber.foreground
gutter_border = "#f2e9e1" # none in the source: ui.border
cursor = "#9893a5" # editorCursor.foreground
selection = "#6e6a8614" # editor.selectionBackground
code_background = "#fffaf3" # textCodeBlock.background

# The colors of code, in the code views and in rendered markdown.
[syntax]
keyword = "#286983" # token keyword (for keyword.control)
atom = "#d7827e" # token constant.language (for constant.language)
literal = "#d7827e" # token constant.numeric (for constant.numeric)
string = "#ea9d34" # token string (for string.quoted)
regexp = "#ea9d34" # token string (for string.regexp)
definition = "#d7827e" # token entity.name (for entity.name.function)
local = "#907aa9" # token variable.parameter (for variable.parameter)
type = "#56949f" # token entity.name.type (for entity.name.type)
class = "#d7827e" # token entity.name (for entity.name.class)
macro = "#d7827e" # token entity.name (for entity.name.function.preprocessor)
property = "#575279" # token variable.other (for variable.other.property)
comment = "#9893a5" # token comment (for comment.line)
meta = "#286983" # token storage.type (for storage.type.annotation)
invalid = "#b4637a" # token invalid (for invalid)
warning = "#ea9d34" # editorWarning.foreground

# The diff layer's lines, tinted by diff_alpha, and the git gutter's bars.
[diff]
added = "#56949f" # editorGutter.addedBackground
removed = "#b4637a" # editorGutter.deletedBackground
changed = "#d7827e" # editorGutter.modifiedBackground
