# Everforest Dark Medium, converted to a Skiff Code theme.
# Source: https://github.com/sainnhe/everforest at 85a86eb62409e3ec88713bff3d1b9d7374e112e4,
#   the highlight groups of :colorscheme everforest, with background=dark and let g:everforest_background = 'medium', read in Neovim v0.12.4
# License: MIT, Copyright (c) 2019 sainnhe. The full text is in NOTICE.md beside this file.
# Written by code/web/scripts/themes/generate.ts from scripts/themes/data/everforest.json. The comment
# after each color names what in the source it came from.
base = "dark"

# The menu, the sidebar, the palette, the open files menu and the banner.
[ui]
background = "#3d484d" # NormalFloat bg
foreground = "#d3c6aa" # NormalFloat fg
muted = "#859289" # Comment fg
border = "#859289" # FloatBorder fg
faint = "#4f585e" # NonText fg
subtle = "#343f44" # CursorLine bg
accent = "#a7c080" # Function fg
scrim = "#2d353b99" # none in the source: editor.background at alpha 99
strong_background = "#a7c080" # PmenuSel bg
strong_foreground = "#2d353b" # PmenuSel fg

# The document: the code views and rendered markdown.
[editor]
background = "#2d353b" # Normal bg
foreground = "#d3c6aa" # Normal fg
gutter_background = "#2d353b" # none in the source: editor.background
gutter_foreground = "#56635f" # LineNr fg
gutter_border = "#4f585e" # WinSeparator fg (via VertSplit)
cursor = "#d3c6aa" # Cursor bg
selection = "#543a48" # Visual bg
code_background = "#343f44" # ColorColumn bg

# The colors of code, in the code views and in rendered markdown.
[syntax]
keyword = "#e67e80" # @keyword fg (via Red)
atom = "#d699b6" # @boolean fg (via Purple)
literal = "#d699b6" # @number fg (via Purple)
string = "#83c092" # @string fg (via Aqua)
regexp = "#a7c080" # @string.regexp fg (via Green)
definition = "#a7c080" # @function fg (via Green)
local = "#d3c6aa" # @variable.parameter fg (via Fg)
type = "#dbbc7f" # @type fg (via YellowItalic)
class = "#dbbc7f" # @lsp.type.class fg (via YellowItalic)
macro = "#a7c080" # @function.macro fg (via Green)
property = "#7fbbb3" # @property fg (via Blue)
comment = "#859289" # @comment fg (via Comment)
meta = "#d699b6" # @attribute fg (via Purple)
invalid = "#e67e80" # DiagnosticError fg
warning = "#dbbc7f" # DiagnosticWarn fg

# The diff layer's lines, tinted by diff_alpha, and the git gutter's bars.
[diff]
added = "#a7c080" # GitSignsAdd fg (via GreenSign)
removed = "#e67e80" # GitSignsDelete fg (via RedSign)
changed = "#7fbbb3" # GitSignsChange fg (via BlueSign)
