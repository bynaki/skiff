# Gruvbox Dark Medium, converted to a Skiff Code theme.
# Source: https://github.com/morhetz/gruvbox at ef8864bb42bf244f0295d1c5a403b27e3d139695,
#   the highlight groups of :colorscheme gruvbox, with background=dark and let g:gruvbox_contrast_dark = 'medium' and let g:gruvbox_invert_selection = 0, read in Neovim v0.12.4
# License: MIT, by Pavel Pertsev, whose repository states MIT/X11 without a license file. The full text is in NOTICE.md beside this file.
# Written by code/web/scripts/themes/generate.ts from scripts/themes/data/gruvbox.json. The comment
# after each color names what in the source it came from.
base = "dark"

# The menu, the sidebar, the palette, the open files menu and the banner.
[ui]
background = "#282828" # none in the source: editor.background
foreground = "#ebdbb2" # none in the source: editor.foreground
muted = "#928374" # Comment fg
border = "#ebdbb2" # WinSeparator fg (via Normal)
faint = "#504945" # NonText fg (via GruvboxBg2)
subtle = "#3c3836" # CursorLine bg
accent = "#b8bb26" # Function fg (via GruvboxGreenBold)
scrim = "#28282899" # none in the source: editor.background at alpha 99
strong_background = "#83a598" # PmenuSel bg
strong_foreground = "#504945" # PmenuSel fg

# The document: the code views and rendered markdown.
[editor]
background = "#282828" # Normal bg
foreground = "#ebdbb2" # Normal fg
gutter_background = "#3c3836" # SignColumn bg
gutter_foreground = "#7c6f64" # LineNr fg
gutter_border = "#ebdbb2" # WinSeparator fg (via Normal)
cursor = "#ebdbb2" # Cursor bg (reversed)
selection = "#665c54" # Visual bg
code_background = "#3c3836" # ColorColumn bg

# The colors of code, in the code views and in rendered markdown.
[syntax]
keyword = "#fb4934" # @keyword fg (via GruvboxRed)
atom = "#d3869b" # @boolean fg (via GruvboxPurple)
literal = "#d3869b" # @number fg (via GruvboxPurple)
string = "#b8bb26" # @string fg (via String)
regexp = "#fe8019" # @string.regexp fg (via GruvboxOrange)
definition = "#b8bb26" # @function fg (via GruvboxGreenBold)
local = "#ebdbb2" # none in the source: editor.foreground
type = "#fabd2f" # @type fg (via GruvboxYellow)
class = "#fabd2f" # @lsp.type.class fg (via GruvboxYellow)
macro = "#b8bb26" # @function.macro fg (via GruvboxGreenBold)
property = "#83a598" # @property fg (via GruvboxBlue)
comment = "#928374" # @comment fg (via Comment)
meta = "#8ec07c" # @attribute fg (via GruvboxAqua)
invalid = "#fb4934" # ALEErrorSign fg (via GruvboxRedSign)
warning = "#fabd2f" # ALEWarningSign fg (via GruvboxYellowSign)

# The diff layer's lines, tinted by diff_alpha, and the git gutter's bars.
[diff]
added = "#b8bb26" # diffAdded fg (via GruvboxGreen)
removed = "#fb4934" # diffRemoved fg (via GruvboxRed)
changed = "#8ec07c" # diffChanged fg (via GruvboxAqua)
