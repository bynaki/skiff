# Tokyo Night Moon, converted to a Skiff Code theme.
# Source: https://github.com/folke/tokyonight.nvim at cdc07ac78467a233fd62c493de29a17e0cf2b2b6,
#   the highlight groups of :colorscheme tokyonight-moon, read in Neovim v0.12.4
# License: Apache-2.0, by Folke Lemaitre, whose repository states no copyright line. The full text is in NOTICE.md beside this file.
# Written by code/web/scripts/themes/generate.ts from scripts/themes/data/tokyonight.json. The comment
# after each color names what in the source it came from.
base = "dark"

# The menu, the sidebar, the palette, the open files menu and the banner.
[ui]
background = "#1e2030" # NormalFloat bg
foreground = "#c8d3f5" # NormalFloat fg
muted = "#636da6" # Comment fg
border = "#589ed7" # FloatBorder fg
faint = "#545c7e" # NonText fg
subtle = "#2f334d" # CursorLine bg
accent = "#82aaff" # Function fg
scrim = "#22243699" # none in the source: editor.background at alpha 99
strong_background = "#363c58" # PmenuSel bg
strong_foreground = "#c8d3f5" # Pmenu fg

# The document: the code views and rendered markdown.
[editor]
background = "#222436" # Normal bg
foreground = "#c8d3f5" # Normal fg
gutter_background = "#222436" # SignColumn bg
gutter_foreground = "#3b4261" # LineNr fg
gutter_border = "#1b1d2b" # WinSeparator fg
cursor = "#c8d3f5" # Cursor bg
selection = "#2d3f76" # Visual bg
code_background = "#1b1d2b" # ColorColumn bg

# The colors of code, in the code views and in rendered markdown.
[syntax]
keyword = "#fca7ea" # @keyword fg
atom = "#ff966c" # @boolean fg (via Constant)
literal = "#ff966c" # @number fg (via Constant)
string = "#c3e88d" # @string fg (via String)
regexp = "#b4f9f8" # @string.regexp fg
definition = "#82aaff" # @function fg (via Function)
local = "#ffc777" # @variable.parameter fg
type = "#65bcff" # @type fg (via Type)
class = "#65bcff" # @lsp.type.class fg (via Type)
macro = "#86e1fc" # @function.macro fg (via PreProc)
property = "#4fd6be" # @property fg
comment = "#636da6" # @comment fg (via Comment)
meta = "#86e1fc" # @attribute fg (via PreProc)
invalid = "#c53b53" # DiagnosticError fg
warning = "#ffc777" # DiagnosticWarn fg

# The diff layer's lines, tinted by diff_alpha, and the git gutter's bars.
[diff]
added = "#b8db87" # GitSignsAdd fg
removed = "#e26a75" # GitSignsDelete fg
changed = "#7ca1f2" # GitSignsChange fg
