# Flexoki Light, converted to a Skiff Code theme.
# Source: https://github.com/kepano/flexoki at 8d723bac4a9ac46adfdf99d42155286977aac72a,
#   vscode/Flexoki-Light-color-theme.json
# License: MIT, Copyright (c) 2023 Steph Ango. The full text is in NOTICE.md beside this file.
# Written by code/web/scripts/themes/generate.ts from scripts/themes/data/flexoki.json. The comment
# after each color names what in the source it came from.
base = "light"

# The menu, the sidebar, the palette, the open files menu and the banner.
[ui]
background = "#fffcf0" # sideBar.background
foreground = "#100f0f" # sideBar.foreground
muted = "#6f6e69" # none in the source: syntax.comment
border = "#dad8ce" # panel.border
faint = "#61616180" # disabledForeground: VS Code's default for a light theme
subtle = "#dad8ce" # list.hoverBackground
accent = "#24837b" # button.background
scrim = "#fffcf099" # none in the source: editor.background at alpha 99
strong_background = "#24837b" # button.background
strong_foreground = "#fffcf0" # button.foreground

# The document: the code views and rendered markdown.
[editor]
background = "#fffcf0" # editor.background
foreground = "#100f0f" # editor.foreground
gutter_background = "#fffcf0" # editorGutter.background
gutter_foreground = "#cecdc3" # editorLineNumber.foreground
gutter_border = "#dad8ce" # editorGroup.border
cursor = "#000000" # editorCursor.foreground: VS Code's default for a light theme
selection = "#100f0f44" # editor.selectionBackground
code_background = "#fffcf0" # none in the source: ui.background

# The colors of code, in the code views and in rendered markdown.
[syntax]
keyword = "#66800b" # token keyword (for keyword.control)
atom = "#5e409d" # none in the source: syntax.literal
literal = "#5e409d" # token constant.numeric (for constant.numeric)
string = "#24837b" # token string (for string.quoted)
regexp = "#24837b" # token string (for string.regexp)
definition = "#bc5215" # token entity.name.function (for entity.name.function)
local = "#100f0f" # token variable.parameter (for variable.parameter)
type = "#ad8301" # token entity.name.type (for entity.name.type)
class = "#bc5215" # token entity.name.type.class (for entity.name.type.class)
macro = "#205ea6" # token entity.name.function.preprocessor (for entity.name.function.preprocessor)
property = "#205ea6" # token variable.other.property (for variable.other.property)
comment = "#6f6e69" # token comment (for comment.line)
meta = "#ad8301" # token meta.decorator (for meta.decorator)
invalid = "#af3029" # editorError.foreground
warning = "#bc5215" # editorWarning.foreground

# The diff layer's lines, tinted by diff_alpha, and the git gutter's bars.
[diff]
added = "#66800b" # editorGutter.addedBackground
removed = "#af3029" # editorGutter.deletedBackground
changed = "#24837b" # editorGutter.modifiedBackground
