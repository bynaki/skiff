# Catppuccin Latte, converted to a Skiff Code theme.
# Source: https://github.com/catppuccin/vscode at befc9e6fc41980f4241408f7049755d47c06ff45,
#   themes/latte.json as built into catppuccin-vsc-3.19.0.vsix, the catppuccin-vsc-v3.19.0 release
# License: MIT, Copyright (c) 2021 Catppuccin. The full text is in NOTICE.md beside this file.
# Written by code/web/scripts/themes/generate.ts from scripts/themes/data/catppuccin.json. The comment
# after each color names what in the source it came from.
base = "light"

# The menu, the sidebar, the palette, the open files menu and the banner.
[ui]
background = "#e6e9ef" # sideBar.background
foreground = "#4c4f69" # sideBar.foreground
muted = "#4c4f69" # descriptionForeground
border = "#acb0be" # panel.border
faint = "#6c6f85" # disabledForeground
subtle = "#ccd0da80" # list.hoverBackground
accent = "#8839ef" # focusBorder
scrim = "#eff1f599" # none in the source: editor.background at alpha 99
strong_background = "#8839ef" # button.background
strong_foreground = "#dce0e8" # button.foreground

# The document: the code views and rendered markdown.
[editor]
background = "#eff1f5" # editor.background
foreground = "#4c4f69" # editor.foreground
gutter_background = "#eff1f5" # editorGutter.background
gutter_foreground = "#8c8fa1" # editorLineNumber.foreground
gutter_border = "#acb0be" # editorGroup.border
cursor = "#dc8a78" # editorCursor.foreground
selection = "#7c7f934d" # editor.selectionBackground
code_background = "#e6e9ef" # textCodeBlock.background

# The colors of code, in the code views and in rendered markdown.
[syntax]
keyword = "#8839ef" # token keyword (for keyword.control)
atom = "#d20f39" # token constant.language (for constant.language)
literal = "#fe640b" # token constant.numeric (for constant.numeric)
string = "#40a02b" # token string (for string.quoted)
regexp = "#40a02b" # token string (for string.regexp)
definition = "#1e66f5" # token entity.name.function (for entity.name.function)
local = "#e64553" # token variable.parameter (for variable.parameter)
type = "#df8e1d" # token entity.name.type (for entity.name.type)
class = "#df8e1d" # token entity.name.class (for entity.name.class)
macro = "#1e66f5" # token entity.name.function (for entity.name.function.preprocessor)
property = "#4c4f69" # none in the source: editor.foreground
comment = "#7c7f93" # token comment (for comment.line)
meta = "#fe640b" # token meta.decorator (for meta.decorator)
invalid = "#d20f39" # editorError.foreground
warning = "#fe640b" # editorWarning.foreground

# The diff layer's lines, tinted by diff_alpha, and the git gutter's bars.
[diff]
added = "#40a02b" # editorGutter.addedBackground
removed = "#d20f39" # editorGutter.deletedBackground
changed = "#df8e1d" # editorGutter.modifiedBackground
