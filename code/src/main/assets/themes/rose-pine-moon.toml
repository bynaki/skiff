# Rosé Pine Moon, converted to a Skiff Code theme.
# Source: https://github.com/rose-pine/vscode at d8f5ebe8e096fa833e997c07eb7685ee1677a4ba,
#   themes/rose-pine-moon-color-theme.json
# License: MIT, Copyright (c) 2021 Rosé Pine. The full text is in NOTICE.md beside this file.
# Written by code/web/scripts/themes/generate.ts from scripts/themes/data/rose-pine.json. The comment
# after each color names what in the source it came from.
base = "dark"

# The menu, the sidebar, the palette, the open files menu and the banner.
[ui]
background = "#232136" # sideBar.background
foreground = "#908caa" # sideBar.foreground
muted = "#908caa" # descriptionForeground
border = "#393552" # editorWidget.border
faint = "#cccccc80" # disabledForeground: VS Code's default for a dark theme
subtle = "#817c9c14" # list.hoverBackground
accent = "#ea9a97" # button.background
scrim = "#23213699" # none in the source: editor.background at alpha 99
strong_background = "#ea9a97" # button.background
strong_foreground = "#232136" # button.foreground

# The document: the code views and rendered markdown.
[editor]
background = "#232136" # editor.background
foreground = "#e0def4" # editor.foreground
gutter_background = "#232136" # editorGutter.background
gutter_foreground = "#908caa" # editorLineNumber.foreground
gutter_border = "#393552" # none in the source: ui.border
cursor = "#6e6a86" # editorCursor.foreground
selection = "#817c9c26" # editor.selectionBackground
code_background = "#2a273f" # textCodeBlock.background

# The colors of code, in the code views and in rendered markdown.
[syntax]
keyword = "#3e8fb0" # token keyword (for keyword.control)
atom = "#ea9a97" # token constant.language (for constant.language)
literal = "#ea9a97" # token constant.numeric (for constant.numeric)
string = "#f6c177" # token string (for string.quoted)
regexp = "#f6c177" # token string (for string.regexp)
definition = "#ea9a97" # token entity.name (for entity.name.function)
local = "#c4a7e7" # token variable.parameter (for variable.parameter)
type = "#9ccfd8" # token entity.name.type (for entity.name.type)
class = "#ea9a97" # token entity.name (for entity.name.class)
macro = "#ea9a97" # token entity.name (for entity.name.function.preprocessor)
property = "#e0def4" # token variable.other (for variable.other.property)
comment = "#6e6a86" # token comment (for comment.line)
meta = "#3e8fb0" # token storage.type (for storage.type.annotation)
invalid = "#eb6f92" # token invalid (for invalid)
warning = "#f6c177" # editorWarning.foreground

# The diff layer's lines, tinted by diff_alpha, and the git gutter's bars.
[diff]
added = "#9ccfd8" # editorGutter.addedBackground
removed = "#eb6f92" # editorGutter.deletedBackground
changed = "#ea9a97" # editorGutter.modifiedBackground
