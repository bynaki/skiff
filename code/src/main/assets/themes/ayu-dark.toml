# Ayu Dark, converted to a Skiff Code theme.
# Source: https://github.com/ayu-theme/vscode-ayu at 7f438df22446f02e79cdfc2f3771b0b273f34654,
#   ayu-dark.json
# License: MIT, Copyright (c) 2016 Ike Kurghinyan. The full text is in NOTICE.md beside this file.
# Written by code/web/scripts/themes/generate.ts from scripts/themes/data/ayu.json. The comment
# after each color names what in the source it came from.
base = "dark"

# The menu, the sidebar, the palette, the open files menu and the banner.
[ui]
background = "#0d1017" # sideBar.background
foreground = "#5a6378" # foreground
muted = "#5a6378" # descriptionForeground
border = "#1b1f29" # panel.border
faint = "#5a637880" # disabledForeground
subtle = "#47526640" # list.hoverBackground
accent = "#e6b450" # focusBorder
scrim = "#10141c99" # none in the source: editor.background at alpha 99
strong_background = "#e6b450" # button.background
strong_foreground = "#765b24" # button.foreground

# The document: the code views and rendered markdown.
[editor]
background = "#10141c" # editor.background
foreground = "#bfbdb6" # editor.foreground
gutter_background = "#10141c" # none in the source: editor.background
gutter_foreground = "#5a6378a6" # editorLineNumber.foreground
gutter_border = "#1b1f29" # editorGroup.border
cursor = "#e6b450" # editorCursor.foreground
selection = "#3388ff40" # editor.selectionBackground
code_background = "#0d1017" # none in the source: ui.background

# The colors of code, in the code views and in rendered markdown.
[syntax]
keyword = "#ff8f40" # token keyword (for keyword.control)
atom = "#d2a6ff" # token constant.language (for constant.language)
literal = "#d2a6ff" # token constant.numeric (for constant.numeric)
string = "#aad94c" # token string (for string.quoted)
regexp = "#95e6cb" # token string.regexp (for string.regexp)
definition = "#ffb454" # token entity.name.function (for entity.name.function)
local = "#d2a6ff" # token variable.parameter (for variable.parameter)
type = "#59c2ff" # token entity.name (for entity.name.type)
class = "#59c2ff" # token entity.name (for entity.name.class)
macro = "#ffb454" # token entity.name.function (for entity.name.function.preprocessor)
property = "#bfbdb6" # token variable (for variable.other.property)
comment = "#5a6673" # token comment (for comment.line)
meta = "#e6c08a" # token storage.type.annotation (for storage.type.annotation)
invalid = "#d95757" # token invalid (for invalid)
warning = "#e6b450" # editorWarning.foreground

# The diff layer's lines, tinted by diff_alpha, and the git gutter's bars.
[diff]
added = "#70bf56" # editorGutter.addedBackground
removed = "#f26d78" # editorGutter.deletedBackground
changed = "#73b8ff" # editorGutter.modifiedBackground
