# Kanagawa Dragon, converted to a Skiff Code theme.
# Source: https://github.com/rebelot/kanagawa.nvim at bb85e4bfc8d89b0e62c8fa53ccdd13d12e2f77b3,
#   the highlight groups of :colorscheme kanagawa-dragon, read in Neovim v0.12.4
# License: MIT, Copyright (c) 2021 Tommaso Laurenzi. The full text is in NOTICE.md beside this file.
# Written by code/web/scripts/themes/generate.ts from scripts/themes/data/kanagawa.json. The comment
# after each color names what in the source it came from.
base = "dark"

# The menu, the sidebar, the palette, the open files menu and the banner.
[ui]
background = "#0d0c0c" # NormalFloat bg
foreground = "#c8c093" # NormalFloat fg
muted = "#737c73" # Comment fg
border = "#54546d" # FloatBorder fg
faint = "#625e5a" # NonText fg
subtle = "#393836" # CursorLine bg
accent = "#8ba4b0" # Function fg
scrim = "#18161699" # none in the source: editor.background at alpha 99
strong_background = "#2d4f67" # PmenuSel bg
strong_foreground = "#dcd7ba" # Pmenu fg

# The document: the code views and rendered markdown.
[editor]
background = "#181616" # Normal bg
foreground = "#c5c9c5" # Normal fg
gutter_background = "#282727" # SignColumn bg
gutter_foreground = "#625e5a" # LineNr fg
gutter_border = "#0d0c0c" # WinSeparator fg
cursor = "#c5c9c5" # Cursor bg
selection = "#223249" # Visual bg
code_background = "#282727" # ColorColumn bg

# The colors of code, in the code views and in rendered markdown.
[syntax]
keyword = "#8992a7" # @keyword fg (via Keyword)
atom = "#b6927b" # @boolean fg (via Boolean)
literal = "#a292a3" # @number fg (via Number)
string = "#8a9a7b" # @string fg (via String)
regexp = "#c4746e" # @string.regexp fg
definition = "#8ba4b0" # @function fg (via Function)
local = "#a6a69c" # @variable.parameter fg
type = "#8ea4a2" # @type fg (via Type)
class = "#8ea4a2" # @lsp.type.class fg (via Type)
macro = "#c4746e" # @function.macro fg (via PreProc)
property = "#c4b28a" # @property fg (via Identifier)
comment = "#737c73" # @comment fg (via Comment)
meta = "#b6927b" # @attribute fg (via Constant)
invalid = "#e82424" # DiagnosticError fg
warning = "#ff9e3b" # DiagnosticWarn fg

# The diff layer's lines, tinted by diff_alpha, and the git gutter's bars.
[diff]
added = "#76946a" # GitSignsAdd fg
removed = "#c34043" # GitSignsDelete fg
changed = "#dca561" # GitSignsChange fg
