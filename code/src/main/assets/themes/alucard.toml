# Alucard, converted to a Skiff Code theme.
# Source: https://github.com/dracula/visual-studio-code at 9726e1f6b51a4382334bc36e03128fcf02c3fb45,
#   theme/dracula.json as built into dracula.vsix, the v2.24.3 release, read as a light theme with each color replaced by its Alucard counterpart in the Dracula spec (https://draculatheme.com/spec)
# License: MIT, Copyright (c) 2016 Dracula Theme. The full text is in NOTICE.md beside this file.
# Written by code/web/scripts/themes/generate.ts from scripts/themes/data/dracula.json. The comment
# after each color names what in the source it came from.
base = "light"

# The menu, the sidebar, the palette, the open files menu and the banner.
[ui]
background = "#ceccc0" # sideBar.background, Dracula's #21222c as Alucard's
foreground = "#1f1f1f" # foreground, Dracula's #f8f8f2 as Alucard's
muted = "#6c664b" # none in the source: syntax.comment
border = "#644ac9" # panel.border, Dracula's #bd93f9 as Alucard's
faint = "#61616180" # disabledForeground: VS Code's default for a light theme
subtle = "#cfcfde75" # list.hoverBackground, Dracula's #44475a as Alucard's
accent = "#6c664b" # focusBorder, Dracula's #6272a4 as Alucard's
scrim = "#fffbeb99" # none in the source: editor.background at alpha 99
strong_background = "#cfcfde" # button.background, Dracula's #44475a as Alucard's
strong_foreground = "#1f1f1f" # button.foreground, Dracula's #f8f8f2 as Alucard's

# The document: the code views and rendered markdown.
[editor]
background = "#fffbeb" # editor.background, Dracula's #282a36 as Alucard's
foreground = "#1f1f1f" # editor.foreground, Dracula's #f8f8f2 as Alucard's
gutter_background = "#fffbeb" # none in the source: editor.background
gutter_foreground = "#6c664b" # editorLineNumber.foreground, Dracula's #6272a4 as Alucard's
gutter_border = "#644ac9" # editorGroup.border, Dracula's #bd93f9 as Alucard's
cursor = "#000000" # editorCursor.foreground: VS Code's default for a light theme
selection = "#cfcfde" # editor.selectionBackground, Dracula's #44475a as Alucard's
code_background = "#ceccc0" # none in the source: ui.background

# The colors of code, in the code views and in rendered markdown.
[syntax]
keyword = "#a3144d" # token keyword (for keyword.control), Dracula's #ff79c6 as Alucard's
atom = "#644ac9" # token constant (for constant.language), Dracula's #bd93f9 as Alucard's
literal = "#644ac9" # token constant (for constant.numeric), Dracula's #bd93f9 as Alucard's
string = "#846e15" # token string (for string.quoted), Dracula's #f1fa8c as Alucard's
regexp = "#846e15" # token string.regexp (for string.regexp), Dracula's #f1fa8c as Alucard's
definition = "#14710a" # token entity.name.function (for entity.name.function), Dracula's #50fa7b as Alucard's
local = "#a34d14" # token variable.parameter (for variable.parameter), Dracula's #ffb86c as Alucard's
type = "#036a96" # token entity.name.type (for entity.name.type), Dracula's #8be9fd as Alucard's
class = "#036a96" # token entity.name.class (for entity.name.class), Dracula's #8be9fd as Alucard's
macro = "#14710a" # token entity.name.function (for entity.name.function.preprocessor), Dracula's #50fa7b as Alucard's
property = "#1f1f1f" # token variable (for variable.other.property), Dracula's #f8f8f2 as Alucard's
comment = "#6c664b" # token comment (for comment.line), Dracula's #6272a4 as Alucard's
meta = "#a3144d" # token storage (for storage.type.annotation), Dracula's #ff79c6 as Alucard's
invalid = "#cb3a2a" # token invalid (for invalid), Dracula's #ff5555 as Alucard's
warning = "#036a96" # editorWarning.foreground, Dracula's #8be9fd as Alucard's

# The diff layer's lines, tinted by diff_alpha, and the git gutter's bars.
[diff]
added = "#89b67a" # editorGutter.addedBackground, Dracula's #50fa7b as Alucard's, over editor.background
removed = "#e59a8a" # editorGutter.deletedBackground, Dracula's #ff5555 as Alucard's, over editor.background
changed = "#81b2c0" # editorGutter.modifiedBackground, Dracula's #8be9fd as Alucard's, over editor.background
