# Catppuccin Frappé, converted to a Skiff Code theme.
# Source: https://github.com/catppuccin/vscode at befc9e6fc41980f4241408f7049755d47c06ff45,
#   themes/frappe.json as built into catppuccin-vsc-3.19.0.vsix, the catppuccin-vsc-v3.19.0 release
# License: MIT, Copyright (c) 2021 Catppuccin. The full text is in NOTICE.md beside this file.
# Written by code/web/scripts/themes/generate.ts from scripts/themes/data/catppuccin.json. The comment
# after each color names what in the source it came from.
base = "dark"

# The menu, the sidebar, the palette, the open files menu and the banner.
[ui]
background = "#292c3c" # sideBar.background
foreground = "#c6d0f5" # sideBar.foreground
muted = "#c6d0f5" # descriptionForeground
border = "#626880" # panel.border
faint = "#a5adce" # disabledForeground
subtle = "#41455980" # list.hoverBackground
accent = "#ca9ee6" # focusBorder
scrim = "#30344699" # none in the source: editor.background at alpha 99
strong_background = "#ca9ee6" # button.background
strong_foreground = "#232634" # button.foreground

# The document: the code views and rendered markdown.
[editor]
background = "#303446" # editor.background
foreground = "#c6d0f5" # editor.foreground
gutter_background = "#303446" # editorGutter.background
gutter_foreground = "#838ba7" # editorLineNumber.foreground
gutter_border = "#626880" # editorGroup.border
cursor = "#f2d5cf" # editorCursor.foreground
selection = "#949cbb40" # editor.selectionBackground
code_background = "#292c3c" # textCodeBlock.background

# The colors of code, in the code views and in rendered markdown.
[syntax]
keyword = "#ca9ee6" # token keyword (for keyword.control)
atom = "#e78284" # token constant.language (for constant.language)
literal = "#ef9f76" # token constant.numeric (for constant.numeric)
string = "#a6d189" # token string (for string.quoted)
regexp = "#a6d189" # token string (for string.regexp)
definition = "#8caaee" # token entity.name.function (for entity.name.function)
local = "#ea999c" # token variable.parameter (for variable.parameter)
type = "#e5c890" # token entity.name.type (for entity.name.type)
class = "#e5c890" # token entity.name.class (for entity.name.class)
macro = "#8caaee" # token entity.name.function (for entity.name.function.preprocessor)
property = "#c6d0f5" # none in the source: editor.foreground
comment = "#949cbb" # token comment (for comment.line)
meta = "#ef9f76" # token meta.decorator (for meta.decorator)
invalid = "#e78284" # editorError.foreground
warning = "#ef9f76" # editorWarning.foreground

# The diff layer's lines, tinted by diff_alpha, and the git gutter's bars.
[diff]
added = "#a6d189" # editorGutter.addedBackground
removed = "#e78284" # editorGutter.deletedBackground
changed = "#e5c890" # editorGutter.modifiedBackground
