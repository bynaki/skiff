# Tokyo Night Day, converted to a Skiff Code theme.
# Source: https://github.com/folke/tokyonight.nvim at cdc07ac78467a233fd62c493de29a17e0cf2b2b6,
#   the highlight groups of :colorscheme tokyonight-day, read in Neovim v0.12.4
# License: Apache-2.0, by Folke Lemaitre, whose repository states no copyright line. The full text is in NOTICE.md beside this file.
# Written by code/web/scripts/themes/generate.ts from scripts/themes/data/tokyonight.json. The comment
# after each color names what in the source it came from.
base = "light"

# The menu, the sidebar, the palette, the open files menu and the banner.
[ui]
background = "#d0d5e3" # NormalFloat bg
foreground = "#3760bf" # NormalFloat fg
muted = "#848cb5" # Comment fg
border = "#4094a3" # FloatBorder fg
faint = "#8990b3" # NonText fg
subtle = "#c4c8da" # CursorLine bg
accent = "#2e7de9" # Function fg
scrim = "#e1e2e799" # none in the source: editor.background at alpha 99
strong_background = "#b3b8d1" # PmenuSel bg
strong_foreground = "#3760bf" # Pmenu fg

# The document: the code views and rendered markdown.
[editor]
background = "#e1e2e7" # Normal bg
foreground = "#3760bf" # Normal fg
gutter_background = "#e1e2e7" # SignColumn bg
gutter_foreground = "#a8aecb" # LineNr fg
gutter_border = "#b4b5b9" # WinSeparator fg
cursor = "#3760bf" # Cursor bg
selection = "#b7c1e3" # Visual bg
code_background = "#b4b5b9" # ColorColumn bg

# The colors of code, in the code views and in rendered markdown.
[syntax]
keyword = "#7847bd" # @keyword fg
atom = "#b15c00" # @boolean fg (via Constant)
literal = "#b15c00" # @number fg (via Constant)
string = "#587539" # @string fg (via String)
regexp = "#2e5857" # @string.regexp fg
definition = "#2e7de9" # @function fg (via Function)
local = "#8c6c3e" # @variable.parameter fg
type = "#188092" # @type fg (via Type)
class = "#188092" # @lsp.type.class fg (via Type)
macro = "#007197" # @function.macro fg (via PreProc)
property = "#387068" # @property fg
comment = "#848cb5" # @comment fg (via Comment)
meta = "#007197" # @attribute fg (via PreProc)
invalid = "#c64343" # DiagnosticError fg
warning = "#8c6c3e" # DiagnosticWarn fg

# The diff layer's lines, tinted by diff_alpha, and the git gutter's bars.
[diff]
added = "#4197a4" # GitSignsAdd fg
removed = "#c47981" # GitSignsDelete fg
changed = "#506d9c" # GitSignsChange fg
