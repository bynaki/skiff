# Cyberdream Light, converted to a Skiff Code theme.
# Source: https://github.com/scottmckendry/cyberdream.nvim at 642c55ad2225f9f4809905918121b2c6d252ad58,
#   the highlight groups of :colorscheme cyberdream-light, read in Neovim v0.12.4
# License: MIT, Copyright (c) 2023 Scott McKendry. The full text is in NOTICE.md beside this file.
# Written by code/web/scripts/themes/generate.ts from scripts/themes/data/cyberdream.json. The comment
# after each color names what in the source it came from.
base = "light"

# The menu, the sidebar, the palette, the open files menu and the banner.
[ui]
background = "#ffffff" # NormalFloat bg
foreground = "#16181a" # NormalFloat fg
muted = "#7b8496" # Comment fg
border = "#acacac" # FloatBorder fg
faint = "#c3c7cf" # NonText fg
subtle = "#acacac" # CursorLine bg
accent = "#0057d1" # Function fg
scrim = "#ffffff99" # none in the source: editor.background at alpha 99
strong_background = "#acacac" # PmenuSel bg
strong_foreground = "#16181a" # PmenuSel fg

# The document: the code views and rendered markdown.
[editor]
background = "#ffffff" # Normal bg
foreground = "#16181a" # Normal fg
gutter_background = "#ffffff" # SignColumn bg
gutter_foreground = "#9d9d9d" # LineNr fg
gutter_border = "#acacac" # WinSeparator fg
cursor = "#16181a" # Cursor bg
selection = "#acacac" # Visual bg
code_background = "#acacac" # ColorColumn bg

# The colors of code, in the code views and in rendered markdown.
[syntax]
keyword = "#d17c00" # @keyword fg (via Keyword)
atom = "#008c99" # @boolean fg (via Boolean)
literal = "#d17c00" # @number fg (via Number)
string = "#008b0c" # @string fg (via String)
regexp = "#f40064" # @string.regexp fg (via Special)
definition = "#0057d1" # @function fg (via Function)
local = "#16181a" # @variable.parameter fg (via @variable)
type = "#a018ff" # @type fg (via Type)
class = "#a018ff" # @lsp.type.class fg (via Type)
macro = "#008c99" # @function.macro fg (via PreProc)
property = "#16181a" # @property fg (via Identifier)
comment = "#7b8496" # @comment fg (via Comment)
meta = "#008c99" # @attribute fg (via PreProc)
invalid = "#d11500" # DiagnosticError fg
warning = "#997b00" # DiagnosticWarn fg

# The diff layer's lines, tinted by diff_alpha, and the git gutter's bars.
[diff]
added = "#008b0c" # GitSignsAdd fg
removed = "#d11500" # GitSignsDelete fg
changed = "#d17c00" # GitSignsChange fg
