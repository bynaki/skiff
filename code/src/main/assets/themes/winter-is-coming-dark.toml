# Winter is Coming Dark, converted to a Skiff Code theme.
# Source: https://github.com/johnpapa/vscode-winteriscoming at 260547834cb6ac37dd5b8bb5842cc1c8d3164946,
#   themes/WinterIsComing-dark-color-theme.json
# License: MIT, Copyright (c) 2015-2017 JohnPapa.net, LLC. The full text is in NOTICE.md beside this file.
# Written by code/web/scripts/themes/generate.ts from scripts/themes/data/winter-is-coming.json. The comment
# after each color names what in the source it came from.
base = "dark"

# The menu, the sidebar, the palette, the open files menu and the banner.
[ui]
background = "#282822" # sideBar.background
foreground = "#7799bb" # sideBar.foreground
muted = "#999999" # none in the source: syntax.comment
border = "#219fd5" # panel.border
faint = "#cccccc80" # disabledForeground: VS Code's default for a dark theme
subtle = "#282822" # list.hoverBackground
accent = "#219fd5" # focusBorder
scrim = "#28282299" # none in the source: editor.background at alpha 99
strong_background = "#4f4f4f" # button.background
strong_foreground = "#ffffff" # button.foreground

# The document: the code views and rendered markdown.
[editor]
background = "#282822" # editor.background
foreground = "#a7dbf7" # editor.foreground
gutter_background = "#282822" # editorGutter.background
gutter_foreground = "#219fd5" # editorLineNumber.foreground
gutter_border = "#219fd544" # editorGroup.border
cursor = "#219fd5" # editorCursor.foreground
selection = "#103362" # editor.selectionBackground
code_background = "#282822" # none in the source: ui.background

# The colors of code, in the code views and in rendered markdown.
[syntax]
keyword = "#00bff9" # token keyword (for keyword.control)
atom = "#92b6f4" # token constant.language (for constant.language)
literal = "#8dec95" # token constant.numeric (for constant.numeric)
string = "#bcf0c0" # token string.quoted (for string.quoted)
regexp = "#bcf0c0" # token string (for string.regexp)
definition = "#87aff4" # token entity.name.function (for entity.name.function)
local = "#d7dbe0" # token variable.parameter (for variable.parameter)
type = "#d29ffc" # token entity.name.type (for entity.name.type)
class = "#f7ecb5" # token entity.name.class (for entity.name.class)
macro = "#87aff4" # token entity.name.function (for entity.name.function.preprocessor)
property = "#7fdbca" # token variable.other.property (for variable.other.property)
comment = "#999999" # token comment (for comment.line)
meta = "#00bff9" # token storage.type (for storage.type.annotation)
invalid = "#6dbdfa" # token invalid (for invalid)
warning = "#ffca28" # editorWarning.foreground

# The diff layer's lines, tinted by diff_alpha, and the git gutter's bars.
[diff]
added = "#487e02" # editorGutter.addedBackground: VS Code's default for a dark theme
removed = "#ef5350" # editorGutter.deletedBackground: VS Code's default, editorError.foreground
changed = "#1b81a8" # editorGutter.modifiedBackground: VS Code's default for a dark theme
