# Kanagawa Paper Canvas, converted to a Skiff Code theme.
# Source: https://github.com/thesimonho/kanagawa-paper.nvim at d6ba194faba511c9b112a13c79b5e123dcb5dd41,
#   the highlight groups of :colorscheme kanagawa-paper-canvas, read in Neovim v0.12.4
# License: MIT, Copyright (c) 2021 Tommaso Laurenzi, Copyright (c) 2024 Simon Ho. The full text is in NOTICE.md beside this file.
# Written by code/web/scripts/themes/generate.ts from scripts/themes/data/kanagawa-paper.json. The comment
# after each color names what in the source it came from.
base = "light"

# The menu, the sidebar, the palette, the open files menu and the banner.
[ui]
background = "#ecece8" # NormalFloat bg
foreground = "#616569" # NormalFloat fg
muted = "#92928b" # Comment fg
border = "#d8d8d2" # FloatBorder fg
faint = "#92928b" # NonText fg
subtle = "#d8d8d2" # CursorLine bg
accent = "#5c8388" # Function fg
scrim = "#e1e1de99" # none in the source: editor.background at alpha 99
strong_background = "#d8d8d2" # PmenuSel bg
strong_foreground = "#616569" # Pmenu fg

# The document: the code views and rendered markdown.
[editor]
background = "#e1e1de" # Normal bg
foreground = "#616569" # Normal fg
gutter_background = "#e1e1de" # none in the source: editor.background
gutter_foreground = "#92928b" # LineNr fg
gutter_border = "#8287a0" # WinSeparator fg
cursor = "#616569" # Cursor bg
selection = "#b2acb2" # Visual bg
code_background = "#e6e6e3" # ColorColumn bg

# The colors of code, in the code views and in rendered markdown.
[syntax]
keyword = "#947992" # @keyword fg (via Keyword)
atom = "#a1805e" # @boolean fg (via Boolean)
literal = "#947992" # @number fg (via Number)
string = "#6a7d66" # @string fg (via String)
regexp = "#a36360" # @string.regexp fg
definition = "#5c8388" # @function fg (via Function)
local = "#616569" # @variable.parameter fg
type = "#5c8388" # @type fg (via Type)
class = "#5c8388" # @lsp.type.class fg (via Type)
macro = "#5c8388" # @function.macro fg (via Function)
property = "#6a7893" # @property fg (via Identifier)
comment = "#92928b" # @comment fg
meta = "#91825e" # @attribute fg
invalid = "#a36360" # DiagnosticError fg
warning = "#a1805e" # DiagnosticWarn fg

# The diff layer's lines, tinted by diff_alpha, and the git gutter's bars.
[diff]
added = "#667659" # GitSignsAdd fg
removed = "#a36360" # GitSignsDelete fg
changed = "#91825e" # GitSignsChange fg
