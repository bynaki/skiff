# Winter is Coming Light, converted to a Skiff Code theme.
# Source: https://github.com/johnpapa/vscode-winteriscoming at 260547834cb6ac37dd5b8bb5842cc1c8d3164946,
#   themes/WinterIsComing-light-color-theme.json
# License: MIT, Copyright (c) 2015-2017 JohnPapa.net, LLC. The full text is in NOTICE.md beside this file.
# Written by code/web/scripts/themes/generate.ts from scripts/themes/data/winter-is-coming.json. The comment
# after each color names what in the source it came from.
base = "light"

# The menu, the sidebar, the palette, the open files menu and the banner.
[ui]
background = "#f3f3f3" # sideBar.background
foreground = "#0d3464cc" # sideBar.foreground
muted = "#357b42" # none in the source: syntax.comment
border = "#49a7cf" # panel.border
faint = "#61616180" # disabledForeground: VS Code's default for a light theme
subtle = "#ccc" # list.hoverBackground
accent = "#2f86d2" # focusBorder
scrim = "#ffffff99" # none in the source: editor.background at alpha 99
strong_background = "#03648a" # button.background
strong_foreground = "#ffffff" # button.foreground

# The document: the code views and rendered markdown.
[editor]
background = "#ffffff" # editor.background
foreground = "#236ebf" # editor.foreground
gutter_background = "#fff" # editorGutter.background
gutter_foreground = "#2f86d2" # editorLineNumber.foreground
gutter_border = "#219fd544" # editorGroup.border
cursor = "#4fb4d8" # editorCursor.foreground
selection = "#cee1f0" # editor.selectionBackground
code_background = "#f3f3f3" # none in the source: ui.background

# The colors of code, in the code views and in rendered markdown.
[syntax]
keyword = "#0991b6" # token keyword (for keyword.control)
atom = "#2970c7" # token constant.language (for constant.language)
literal = "#174781" # token constant.numeric (for constant.numeric)
string = "#a44185" # token string.quoted (for string.quoted)
regexp = "#a44185" # token string (for string.regexp)
definition = "#b1108e" # token entity.name.function (for entity.name.function)
local = "#b1108e" # token variable.parameter (for variable.parameter)
type = "#0444ac" # token entity.name.type (for entity.name.type)
class = "#1172c7" # token entity.name.class (for entity.name.class)
macro = "#b1108e" # token entity.name.function (for entity.name.function.preprocessor)
property = "#7fdbca" # token variable.other.property (for variable.other.property)
comment = "#357b42" # token comment (for comment.line)
meta = "#0991b6" # token storage.type (for storage.type.annotation)
invalid = "#207bb8" # token invalid (for invalid)
warning = "#bf8803" # editorWarning.foreground: VS Code's default for a light theme

# The diff layer's lines, tinted by diff_alpha, and the git gutter's bars.
[diff]
added = "#48985d" # editorGutter.addedBackground: VS Code's default for a light theme
removed = "#ef5350" # editorGutter.deletedBackground: VS Code's default, editorError.foreground
changed = "#2090d3" # editorGutter.modifiedBackground: VS Code's default for a light theme
