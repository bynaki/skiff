# Vague, converted to a Skiff Code theme.
# Source: https://github.com/vague-theme/vague.nvim at 73f8aaa866bf3d14dd0b0ab9e48c11794c1cb7ab,
#   the highlight groups of :colorscheme vague, read in Neovim v0.12.4
# License: MIT, Copyright (c) 2024 Alberto Hernandez. The full text is in NOTICE.md beside this file.
# Written by code/web/scripts/themes/generate.ts from scripts/themes/data/vague.json. The comment
# after each color names what in the source it came from.
base = "dark"

# The menu, the sidebar, the palette, the open files menu and the banner.
[ui]
background = "#1c1c24" # NormalFloat bg
foreground = "#cdcdcd" # NormalFloat fg
muted = "#606079" # Comment fg
border = "#cdcdcd" # FloatBorder fg (via NormalFloat)
faint = "#606079" # NonText fg
subtle = "#252530" # CursorLine bg
accent = "#c48282" # Function fg
scrim = "#14141599" # none in the source: editor.background at alpha 99
strong_background = "#cdcdcd" # PmenuSel bg (reversed)
strong_foreground = "#252530" # PmenuSel fg (reversed)

# The document: the code views and rendered markdown.
[editor]
background = "#141415" # Normal bg
foreground = "#cdcdcd" # Normal fg
gutter_background = "#141415" # none in the source: editor.background
gutter_foreground = "#606079" # LineNr fg
gutter_border = "#878787" # WinSeparator fg
cursor = "#cdcdcd" # Cursor bg
selection = "#333738" # Visual bg
code_background = "#252530" # ColorColumn bg

# The colors of code, in the code views and in rendered markdown.
[syntax]
keyword = "#6e94b2" # @keyword fg (via Keyword)
atom = "#e0a363" # @boolean fg (via Boolean)
literal = "#e0a363" # @number fg (via Number)
string = "#e8b589" # @string fg (via String)
regexp = "#6e94b2" # @string.regexp fg (via SpecialChar)
definition = "#c48282" # @function fg (via Function)
local = "#bb9dbd" # @variable.parameter fg
type = "#9bb4bc" # @type fg (via Type)
class = "#aeaed1" # @lsp.type.class fg (via Structure)
macro = "#6e94b2" # @function.macro fg (via PreProc)
property = "#c3c3d5" # @property fg
comment = "#606079" # @comment fg (via Comment)
meta = "#6e94b2" # @attribute fg (via PreProc)
invalid = "#d8647e" # DiagnosticError fg
warning = "#f3be7c" # DiagnosticWarn fg

# The diff layer's lines, tinted by diff_alpha, and the git gutter's bars.
[diff]
added = "#7fa563" # Added fg
removed = "#d8647e" # Removed fg
changed = "#f3be7c" # Changed fg
